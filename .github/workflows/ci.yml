name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run unit and pipeline tests
        run: python -m pytest -v

      - name: Run Stage 3 end-to-end demo on sanitized samples
        run: |
          python -X utf8 scripts/01_clean_and_index.py --raw examples/sample_raw --db work/unified_index.db --query 记错
          python -X utf8 scripts/02_four_way_match.py --db work/unified_index.db --out work/backfill_candidates.md
          test -f work/unified_index.db
          test -f work/backfill_candidates.md

      - name: Validate 6-file templates
        run: python -X utf8 scripts/03_validate_kit.py --target templates
